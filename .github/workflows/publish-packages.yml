name: Publish Packages

run-name: Publish ${{ inputs.experimental && 'experimental' || 'normal' }} packages${{ inputs.resume && ' (resume)' || '' }}

on:
  workflow_dispatch:
    inputs:
      experimental:
        description: "Publish with the experimental npm tag"
        required: true
        type: boolean
        default: true
      resume:
        description: "Resume an interrupted release: publish only the packages missing from the registry at this version"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    env:
      PUBLISH_SCRIPT: ${{ inputs.experimental && 'deploy:experimental' || 'deploy' }}
      PUBLISH_ARGS: ${{ inputs.resume && '--resume' || '' }}

    steps:
      - name: Require repository admin permissions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          permission="$(gh api repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission --jq .permission 2>/dev/null || true)"

          if [ "${permission}" != "admin" ]; then
            echo "::error::Only repository admins can publish packages. ${{ github.actor }} has '${permission:-none}' permissions."
            exit 1
          fi

      - name: Checkout publish branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: "pnpm"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install

      - name: Publish packages
        run: pnpm ${{ env.PUBLISH_SCRIPT }} ${{ env.PUBLISH_ARGS }}

      - name: Resolve published version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "${GITHUB_OUTPUT}"

      - name: Tag the published commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists; skipping."
            exit 0
          fi

          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub release from changelog
        if: ${{ !inputs.experimental }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A resumed release reaches this step with the release already created by the run that
          # published the earlier packages, and `gh release create` fails on an existing one.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists; skipping."
            exit 0
          fi

          pnpm tsx cli/deploy/print-release-notes.ts "${VERSION}" > release-notes.md
          gh release create "v${VERSION}" --title "v${VERSION}" --notes-file release-notes.md
